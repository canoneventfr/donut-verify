<!DOCTYPE html>
<!-- Static layout mockup for internal design review.
     Structure and values read from the live page's computed styles + DOM shape.
     No payment fields, no redeem keys, no scripts, nothing posts anywhere. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donut SMP | Store</title>
    <meta name="theme-color" content="#FF69B4">
    <link rel="shortcut icon" href="https://website.donutsmp.org/bcGCsev.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        html { font-size: 10px; background: #111111; overscroll-behavior-y: none; }

        @font-face {
            font-family: "MC";
            src: url("https://cdn.jsdelivr.net/gh/IdreesInc/Minecraft-Font@v1.0/Minecraft.otf") format("opentype");
            font-display: swap;
            font-weight: 400;
        }
        @font-face {
            font-family: "MC";
            src: url("https://cdn.jsdelivr.net/gh/IdreesInc/Minecraft-Font@v1.0/Minecraft-Bold.otf") format("opentype");
            font-display: swap;
            font-weight: 700;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #fff;
            color: silver;
            font-family: 'proxima-nova', sans-serif;
            font-size: 14px;
            line-height: normal;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            background: #111111;
            min-height: 100vh;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .main-content { flex: 1; }

        /* ===== HEAD ===== */
        .head {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 104px 0 49px;
        }

        .logo { max-width: 124px; margin: 0 auto; }
        .logo img {
            width: 64px;
            height: 64px;
            max-width: 100%;
            display: inline;
            vertical-align: middle;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(46, 156, 255, 0.15);
            /* source is 500x500 and rendered at 64px — auto lets the browser downscale
               cleanly; pixelated forces nearest-neighbour and aliases. */
            image-rendering: auto;
        }

        .hero-title {
            font-family: "MC", monospace;
            font-size: 30px;
            font-weight: 700;
            color: #f4f4f5;
            letter-spacing: 1.5px;
            line-height: 39px;
            margin: 12px 0 10px;
        }

        .hero-tag {
            font-family: "MC", monospace;
            font-size: 15px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.6px;
            margin: 0 0 12px;
        }

        .below-logo { margin-top: 12px; }

        .hip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            padding: 0;
            cursor: pointer;
            transition: 0.3s;
        }
        .hip code {
            display: block;
            font-family: "MC", monospace;
            font-size: 16px;
            color: rgba(46, 156, 255, 0.35);
            background: none;
            padding: 0;
            border: 0;
            border-radius: 0;
            transition: 0.3s;
        }
        .hip:hover code {
            color: rgb(46, 156, 255);
            text-shadow: 0 0 12px rgba(46, 156, 255, 0.4);
        }
        .copy-icon {
            display: inline-flex;
            color: rgba(46, 156, 255, 0.25);
            transition: 0.3s;
        }
        .hip:hover .copy-icon {
            color: rgba(46, 156, 255, 0.9);
            filter: drop-shadow(0 0 6px rgba(46, 156, 255, 0.4));
        }
        .hip.copied code {
            color: rgb(74, 222, 128);
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
        }
        .hip.copied .copy-icon {
            color: rgb(74, 222, 128);
            filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.4));
        }

        /* ===== PANEL ===== */
        .body { padding: 50px 0 40px; }
        .content { padding: 0; }

        .panel {
            background: #1e1e1e;
            border: none;
            border-bottom: 8px solid #000;
            border-radius: 36px;
            padding: 0 0 20px;
            margin: 0 auto;
            max-width: 940px;
            font-size: 14px;
            box-shadow: rgba(0, 0, 0, 0.06) 0 10px 55px -3px, rgba(0, 0, 0, 0.05) 0 4px 6px -2px;
        }

        .panel-heading {
            padding: 25px;
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            line-height: 37px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px 3px 0 0;
        }

        .panel-body { padding: 25px; }

        .platform-row { text-align: center; margin-bottom: 32px; }

        .platform-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background-color: #111111;
            color: #fff;
            border: none;
            padding: 1.5rem 3rem;
            margin: 0.3rem;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .platform-btn.selected { background-color: #036fff; }
        .platform-btn:hover { transform: scale(1.05); }

        @keyframes ripple {
            to { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        }
        .platform-btn:active::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%) scale(0);
            animation: 0.6s ease-out 0s 1 normal forwards running ripple;
        }

        .username { max-width: 350px; margin: 0 auto; }
        .input-group { display: table; width: 100%; }

        .form-control {
            display: block;
            width: 100%;
            height: 46px;
            padding: 10px 16px;
            font-size: 18px;
            line-height: 1.33;
            color: #fff;
            background-color: #111111;
            border: 1px solid #111111;
            border-radius: 6px 0 0 6px;
            box-shadow: rgba(0, 0, 0, 0.075) 0 1px 1px inset;
            font-family: inherit;
            outline: none;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.45); }

        .input-group-append { display: table-cell; width: 1%; vertical-align: middle; }
        .input-group-append > .btn { margin-left: -1px; }

        .btn {
            display: inline-block;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            background: none;
            font-family: inherit;
        }
        .btn-lg { height: 46px; padding: 10px 16px; font-size: 18px; line-height: 1.33; border-radius: 0 6px 6px 0; }
        .btn-success { background-color: #036fff; border-color: transparent; color: #fff; font-weight: 700; }
        .btn .fa-chevron-right { margin-left: 5px; }

        #errorMessage {
            display: none;
            max-width: 350px;
            margin: 10px auto 0;
            padding: 12px 16px;
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            background: #ffe6e6;
            color: #d32f2f;
            font-size: 14px;
            font-weight: 500;
        }
        #errorMessage.show { display: block; }

        /* ===== FOOT ===== */
        #foot { padding: 40px 0; }
        #foot > .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
        }

        .copyright {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #70757a;
            font-size: 11px;
            font-weight: 600;
        }

        .copyright-text {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .copyright-text > .copyright-text {
            display: flex;
            flex-direction: column;
            align-items: normal;
            justify-content: normal;
            gap: normal;
        }
        .copyright-text > .copyright-text > span {
            font-family: "MC", monospace;
            font-size: 24px;
            font-weight: 400;
            color: #fff;
        }
        .copyright small { font-size: 85%; font-weight: 600; }

        .copyright-links {
            display: flex;
            flex-direction: row;
            align-items: normal;
            justify-content: normal;
            gap: 15px;
            margin-top: 8px;
            font-size: 10px;
        }
        .copyright-links > a {
            display: block;
            color: #7a7a7a;
            font-family: "MC", monospace;
            font-size: 10px;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }
        .copyright-links > a:hover { color: #fff; }
    </style>
</head>

<!--
  Only script in this file. Local UI only: moves the .selected class between the
  two platform buttons and keeps the hidden mine-version input in sync.
  Sends no network requests. No form is submitted.
-->
<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.platform-btn'));
  var hidden = document.getElementById('mineVersionInput');
  var input = document.getElementById('usernameInput');
  var continueBtn = document.getElementById('continueBtn');
  var errorBox = document.getElementById('errorMessage');

  function select(btn) {
    buttons.forEach(function (b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    if (hidden) hidden.value = btn.getAttribute('data-platform');
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { select(btn); });
  });

  // Mirror the live page: initial state comes from the hidden input.
  var initial = hidden && hidden.value;
  var match = buttons.filter(function (b) { return b.getAttribute('data-platform') === initial; });
  if (match.length) {
    buttons.forEach(function (b) { b.classList.remove('selected'); });
    match[0].classList.add('selected');
  }

  function showError(msg) {
    if (!errorBox) return;
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  function clearError() {
    if (!errorBox) return;
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  // Enter key submits, same as the live <form>.
  if (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); go(); }
    });
    input.addEventListener('input', clearError);
  }

  function go() {
    var name = (input && input.value || '').trim();

    if (!name) { showError('Please enter your username'); if (input) input.focus(); return; }
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {
      showError('Invalid username. Use 3-16 letters, numbers or underscores.');
      if (input) input.focus();
      return;
    }

    // Local prototype only: hand the name to the checkout mockup via sessionStorage.
    // No request is sent anywhere.
    try {
      sessionStorage.setItem('mock_username', name);
      sessionStorage.setItem('mock_platform', hidden ? hidden.value : 'java');
    } catch (err) { /* private mode */ }

    window.location.href = '/claim';
  }

  if (continueBtn) continueBtn.addEventListener('click', go);
})();
</script>
