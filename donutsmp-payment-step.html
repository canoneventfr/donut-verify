<!DOCTYPE html>
<!--
  Payment step for the Donut SMP checkout flow, matched to the live
  /payment screen: same palette, metrics, spacing and control styling.

  Own branding throughout (Donut SMP / donutsmp.net) — no third-party payment
  provider's logo, wordmark, imprint or legal attribution.

  Non-functional by construction:
    - no <form>, no submission, no gateway, no payment SDK
    - every input is disabled + readonly: no address, name, postcode or email
      can be entered
    - Complete Order is disabled; nothing is ordered, charged or delivered
    - no network requests of any kind
-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donut SMP | Payment</title>

    <link rel="shortcut icon" href="https://website.donutsmp.org/bcGCsev.png">

    <style>
        html { font-size: 10px; background: #000000; overscroll-behavior-y: none; }
